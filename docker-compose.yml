version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: gigflow-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: gigflow
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'
    networks:
      - gigflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gigflow-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/gigflow
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production-min-32chars}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:80
    ports:
      - '5000:5000'
    depends_on:
      - mongo
    networks:
      - gigflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: gigflow-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - gigflow-network

volumes:
  mongo-data:

networks:
  gigflow-network:
    driver: bridge
